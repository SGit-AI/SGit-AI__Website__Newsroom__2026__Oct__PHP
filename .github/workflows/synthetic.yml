# synthetic@php.newsroom: the six synthetic readers read the live site every hour, and after every deploy.
# Each run is written to that reader's own vault; nothing is committed to this repository, so a run never triggers
# a deploy (which would trigger another run). The site's page shows the snapshot taken at the last release.
# Secrets: SG_SEND_ACCESS_TOKEN (vault writes), SYNTHETIC_VAULT_KEYS ({"board": {"vault_key": "..."}, ...}),
# ANTHROPIC_API_KEY (optional: without it runs are captured and left for an agent session to review).
name: Synthetic readers
on:
  schedule:
    - cron: '23 * * * *'
  workflow_run:
    workflows: [Deploy to GitHub Pages]
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even if the site has not changed since the last run'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: synthetic
  cancel-in-progress: false
jobs:
  read-the-site:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Secrets are given only to the steps that need them, never job-wide: the install steps run third-party code.
    steps:
      - name: Check the secrets are set
        id: ready
        env:
          SG_SEND_ACCESS_TOKEN: ${{ secrets.SG_SEND_ACCESS_TOKEN }}
          SYNTHETIC_VAULT_KEYS: ${{ secrets.SYNTHETIC_VAULT_KEYS }}
        run: |
          if [ -z "$SG_SEND_ACCESS_TOKEN" ] || [ -z "$SYNTHETIC_VAULT_KEYS" ]; then
            echo "SG_SEND_ACCESS_TOKEN or SYNTHETIC_VAULT_KEYS is not set; nothing to do."; echo "go=false" >> "$GITHUB_OUTPUT"
          else echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        if: steps.ready.outputs.go == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        if: steps.ready.outputs.go == 'true'
        with:
          python-version: '3.12'
      - name: Install the browser, sgit and the API client
        if: steps.ready.outputs.go == 'true'
        run: |
          pip install -q playwright==1.56.0 sgit-ai==0.23.0 anthropic==2.1.0
          python -m playwright install --with-deps chromium
      # No actions/cache of the clones: a clone's .sg_vault/local holds its vault key, and a cache is readable by
      # workflows on any branch. Each run clones fresh from SYNTHETIC_VAULT_KEYS.
      - name: Run the readers
        if: steps.ready.outputs.go == 'true'
        env:
          SG_SEND_ACCESS_TOKEN: ${{ secrets.SG_SEND_ACCESS_TOKEN }}
          SYNTHETIC_VAULT_KEYS: ${{ secrets.SYNTHETIC_VAULT_KEYS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          REVIEW=agent; [ -n "$ANTHROPIC_API_KEY" ] && REVIEW=api
          IFCH=--if-changed; [ "${{ github.event.inputs.force }}" = "true" ] && IFCH=
          python admin/synthetic/run.py capture $IFCH --review $REVIEW --push
